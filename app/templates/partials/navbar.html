<div class="container-fluid dashboard-nav-shell">
    <div class="dashboard-nav-row">
        <ul class="nav nav-tabs main-nav mb-0" id="main-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link {% if request.path == url_for('notes') %}active{% endif %}" id="notes-tab-link"
                    data-tab-id="notes" href="{{ url_for('notes') }}" aria-label="Ghi chu" title="Ghi chu">
                    <span class="nav-card-icon notes-icon"><i class="bi bi-journal-richtext"></i></span>
                </a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link {% if request.path == url_for('mxh.mxh_page') %}active{% endif %}" id="mxh-tab-link"
                    data-tab-id="mxh" href="{{ url_for('mxh.mxh_page') }}" aria-label="MXH" title="MXH">
                    <span class="nav-card-icon mxh-icon"><i class="bi bi-share-fill"></i></span>
                </a>
            </li>
            <li class="nav-item nav-item-home" role="presentation">
                <a class="nav-link {% if request.path == url_for('home') %}active{% endif %}" id="home-tab-link"
                    data-tab-id="home" href="{{ url_for('home') }}" aria-label="Home" title="Home">
                    <span class="nav-card-icon home-icon"><i class="bi bi-house-door-fill"></i></span>
                </a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link {% if request.path.startswith('/image') %}active{% endif %}" id="image-tab-link"
                    data-tab-id="image" href="{{ url_for('image.index') }}"
                    onclick="return handleImageNavClick(event);" aria-label="Image" title="Image">
                    <span class="nav-card-icon image-icon"><i class="bi bi-image-fill"></i></span>
                </a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link {% if request.path == url_for('telegram') %}active{% endif %}" id="telegram-tab-link"
                    data-tab-id="telegram" href="{{ url_for('telegram') }}" aria-label="Telegram" title="Telegram">
                    <span class="nav-card-icon telegram-icon"><i class="bi bi-telegram"></i></span>
                </a>
            </li>
        </ul>

        <ul class="navbar-nav dashboard-menu-nav">
            <li class="nav-item dropdown hamburger-menu" id="global-hamburger-menu">
                <a class="nav-link p-1" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                    aria-label="Dashboard menu" title="Menu">
                    <i class="bi bi-list"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" id="hamburger-dropdown-content">
                    <li><span class="dropdown-item text-muted">Loading...</span></li>
                </ul>
            </li>
        </ul>
    </div>
</div>

<script>
    (function () {
        const hamburgerMenu = document.getElementById('global-hamburger-menu');
        if (!hamburgerMenu) return;

        const menuLink = hamburgerMenu.querySelector('.nav-link');
        const dropdownMenu = hamburgerMenu.querySelector('.dropdown-menu');
        const dropdownContentUl = document.getElementById('hamburger-dropdown-content');
        let bsDropdownInstance = null;
        let autoHideTimeout;
        let mouseLeaveTimeout;
        let isMouseOverMenu = false;
        let isMouseOverDropdown = false;

        const getMenuItemsForTab = (tabId) => {
            let items = `
            <li>
                <a class="dropdown-item" href="{{ url_for('settings.settings_page') }}">
                    <i class="bi bi-gear-wide-connected me-2"></i>Cai dat chung
                </a>
            </li>
            <li>
                <button class="dropdown-item" type="button" data-dashboard-action="change-theme">
                    <i class="bi bi-palette me-2"></i>Doi mau theme
                </button>
            </li>
            <li><hr class="dropdown-divider"></li>
        `;

            switch (tabId) {
                case 'notes':
                    items += `<li><a class="dropdown-item" href="#"><i class="bi bi-journal-gear me-2"></i>Cai dat Ghi chu</a></li>`;
                    break;
                case 'mxh':
                    items += `<li><a class="dropdown-item" href="#"><i class="bi bi-share-gear me-2"></i>Cai dat MXH</a></li>`;
                    break;
                case 'image':
                    items += `<li><a class="dropdown-item" href="#"><i class="bi bi-image-gear me-2"></i>Cai dat Image</a></li>`;
                    break;
                case 'telegram':
                    items += `<li><a class="dropdown-item" href="#"><i class="bi bi-telegram me-2"></i>Cai dat Telegram</a></li>`;
                    break;
                default:
                    break;
            }

            return items;
        };

        const updateDropdownContent = () => {
            const activeTabLink = document.querySelector('#main-tab .nav-link.active');
            const activeTabId = activeTabLink ? activeTabLink.dataset.tabId : 'home';
            dropdownContentUl.innerHTML = getMenuItemsForTab(activeTabId);
        };

        const ensureBsInstance = () => {
            if (!bsDropdownInstance) {
                bsDropdownInstance = new bootstrap.Dropdown(menuLink);
            }
            return bsDropdownInstance;
        };

        const showDropdown = () => {
            const instance = ensureBsInstance();
            updateDropdownContent();
            if (!dropdownMenu.classList.contains('show')) instance.show();
        };

        const hideDropdown = () => {
            const instance = ensureBsInstance();
            if (dropdownMenu.classList.contains('show')) instance.hide();
        };

        hamburgerMenu.addEventListener('mouseenter', () => {
            clearTimeout(autoHideTimeout);
            clearTimeout(mouseLeaveTimeout);
            isMouseOverMenu = true;
            showDropdown();
            autoHideTimeout = setTimeout(() => {
                if (!isMouseOverDropdown) hideDropdown();
            }, 2000);
        });

        hamburgerMenu.addEventListener('mouseleave', () => {
            isMouseOverMenu = false;
            mouseLeaveTimeout = setTimeout(() => {
                if (!isMouseOverDropdown) {
                    clearTimeout(autoHideTimeout);
                    hideDropdown();
                }
            }, 300);
        });

        dropdownMenu.addEventListener('mouseenter', () => {
            clearTimeout(autoHideTimeout);
            clearTimeout(mouseLeaveTimeout);
            isMouseOverDropdown = true;
            if (!dropdownMenu.classList.contains('show')) showDropdown();
        });

        dropdownMenu.addEventListener('mouseleave', () => {
            isMouseOverDropdown = false;
            setTimeout(() => {
                if (!isMouseOverMenu && !isMouseOverDropdown) hideDropdown();
            }, 100);
        });

        dropdownMenu.addEventListener('click', (e) => {
            const themeBtn = e.target.closest('[data-dashboard-action="change-theme"]');
            if (themeBtn) {
                e.preventDefault();
                openThemeColorPrompt();
                hideDropdown();
                return;
            }
            if (e.target.closest('.dropdown-item')) hideDropdown();
        });

        hamburgerMenu.addEventListener('hidden.bs.dropdown', () => {
            isMouseOverMenu = false;
            isMouseOverDropdown = false;
            clearTimeout(autoHideTimeout);
            clearTimeout(mouseLeaveTimeout);
        });

        updateDropdownContent();
    })();

    (function applySavedDashboardTheme() {
        const resetVersionKey = 'dashboardThemeResetVersion';
        const resetVersion = 'restore-pre-sample-original-20260516';
        if (localStorage.getItem(resetVersionKey) !== resetVersion) {
            localStorage.setItem('dashboardThemeColor', '#1a1d21');
            localStorage.setItem(resetVersionKey, resetVersion);
        }

        const savedColor = localStorage.getItem('dashboardThemeColor');
        if (savedColor && /^#[0-9a-fA-F]{6}$/.test(savedColor)) {
            document.documentElement.style.setProperty('--dashboard-bg', savedColor);
        }
    })();

    function openThemeColorPrompt() {
        const currentColor = localStorage.getItem('dashboardThemeColor') || '#1a1d21';
        const nextColor = prompt('Nhap ma mau theme dashboard, vi du #1a1d21', currentColor);
        if (nextColor === null) return;

        const normalized = nextColor.trim();
        if (!/^#[0-9a-fA-F]{6}$/.test(normalized)) {
            showToast('Ma mau khong hop le. Hay nhap dang #1a1d21.', 'error');
            return;
        }

        localStorage.setItem('dashboardThemeColor', normalized);
        document.documentElement.style.setProperty('--dashboard-bg', normalized);
        showToast(`Da doi mau theme: ${normalized}`, 'success');
    }

    function handleImageNavClick(event) {
        if (window.location.pathname.startsWith('/image')) {
            event.preventDefault();
            return false;
        }
        return true;
    }
</script>
